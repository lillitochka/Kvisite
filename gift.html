<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Подарунок 💗</title>
  <link rel="stylesheet" href="style.css">
</head>

<body class="page gift-page">

<img
  class="gift-decoration"
  src="Без названия45_20260923133508.png"
>

<div id="giftContent">

  <p class="eyebrow">для тебе є подарунок</p>

  <div class="gift" id="gift">

    <div class="gift-lid"></div>

    <div class="gift-box">
      <div class="ribbon-v"></div>
      <div class="ribbon-h"></div>
    </div>

  </div>

  <p id="giftHint">натисни на подарунок</p>

</div>


<div class="ring-content" id="ringContent">

  <div class="ring">💍</div>

  <h1>Це кільце для тебе</h1>

  <p>
    Хоч ми й на відстані,<br>
    я все одно хочу<br>
    подарувати тобі букетик<br>
    і кільце
  </p>

  <div class="bouquet">💐</div>

  <b>Дякую за те, що ти є 💗</b>

</div>

<script src="script.js"></script>
</body>
</html>
